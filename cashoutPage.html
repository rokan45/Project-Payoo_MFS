<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon">
    <title>Payoo Login</title>

    <!-- Taiwind and DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <!-- Fontawesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>


<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-gray-200 border-b-2 sticky top-0 bg-base-200">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-1">
                <div class="logo w-[60px]">
                    <img src="images/logo.png" alt="">
                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$<span id="balance">45000</span></h2>
                    <h3 class="text-neutral/50">Available Balance</h3>
                </div>
            </div>
            <div class="right">
                <a href="/index.html" class="btn btn-soft"><i
                        class="fa-solid fa-right-from-bracket rotate-180"></i>Logout</a>
            </div>
        </section>
    </header>

    <section class="banner w-11/12 mx-auto py-10">
        <h2 class="text-3xl font-bold">Welcome to Pay<span class="text-[#7460FF]">oo</span></h2>
        <p class="text-neutral/30 text-[16px] py-5">Enjoy easy and convenient financial services with us. Cashout charge
            is low and </p>

        <div class="buttons grid grid-cols-3 gap-3">
            <button class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-1.png" alt="">
                <h2>Add Money</h2>
            </button>
            <button class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-2.png" alt="">
                <h2>Cashout</h2>
            </button>
            <button class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-3.png" alt="">
                <h2>Transfer Money</h2>
            </button>
            <button class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-4.png" alt="">
                <h2>Get Bonus</h2>
            </button>
            <button class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-5.png" alt="">
                <h2>Pay Bill</h2>
            </button>
            <button class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-6.png" alt="">
                <h2>Transactions</h2>
            </button>
        </div>
    </section>

    <section class="cashout w-11/12 mx-auto py-5">
        <h2 class="text-[18px] font-semibold mb-5">Cash Out</h2>
        <div class="card bg-base-100 w-full shrink-0 mx-auto shadow-sm rounded-2xl ">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-[16px] font-medium text-[#080808]">Agent Number</label>
                    <input id="agent-number" type="email" maxlength="11" minlength="11"
                        class="input rounded-4xl w-full bg-[#F4F5F7]" placeholder="Enter 11 digit number"
                        value="01711111111" />
                    <label class="label text-[16px] font-medium text-[#080808]">Amount</label>
                    <input id="amount" type="email" maxlength="11" minlength="11"
                        class="input rounded-4xl bg-[#F4F5F7] w-full" placeholder="Enter amount to withdraw" />
                    <label class="label text-[16px] font-medium text-[#080808]">4 Digit Pin</label>
                    <input id="cashout-pin" type="password" maxlength="4" class="input rounded-4xl bg-[#F4F5F7] w-full"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="cashout-btn"
                        class="btn btn-primary mt-4 rounded-4xl w-full h-[45px] text-[20px] font-semibold">WithDraw
                        Money</button>
                </fieldset>
            </div>
    </section>

    <script src="/script/commonFunction.js"></script>
    <script src="/script/cashout.js"></script>
</body>

</html>
