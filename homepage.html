<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon">
    <title>Home Page</title>

    <!-- Taiwind and DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <!-- Fontawesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>


<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-gray-200 border-b-2 sticky top-0 bg-base-200">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-1">
                <div class="logo w-[60px]">
                    <img src="images/logo.png" alt="">
                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$<span id="balance">45000</span></h2>
                    <h3 class="text-neutral/50">Available Balance</h3>
                </div>
            </div>
            <div class="right">
                <a href="/index.html" class="btn btn-soft"><i
                        class="fa-solid fa-right-from-bracket rotate-180"></i>Logout</a>
            </div>
        </section>
    </header>

    <section class="banner w-11/12 mx-auto py-10">
        <h2 class="text-3xl font-bold">Welcome to Pay<span class="text-[#7460FF]">oo</span></h2>
        <p class="text-neutral/30 text-[16px] py-5">Enjoy easy and convenient financial services with us. Cashout charge
            is low and </p>

        <div class="buttons grid grid-cols-3 gap-3">
            <button id="add-money-page" class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-1.png" alt="">
                <h2>Add Money</h2>
            </button>
            <button id="cash-out-page" class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-2.png" alt="">
                <h2>Cashout</h2>
            </button>
            <button id="transfer-page" class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-3.png" alt="">
                <h2>Transfer Money</h2>
            </button>
            <button id="bonous-page" class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-4.png" alt="">
                <h2>Get Bonus</h2>
            </button>
            <button id="pay-bill-page" class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-5.png" alt="">
                <h2>Pay Bill</h2>
            </button>
            <button class="btn flex-col h-full py-4 btn-primary btn-soft"><img src="/images/opt-6.png" alt="">
                <h2>Transactions</h2>
            </button>
        </div>
    </section>

    <script src="/script/commonFunction.js"></script>
    <script src="/script/cashout.js"></script>
</body>

</html>
